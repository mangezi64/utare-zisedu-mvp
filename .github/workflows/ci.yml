name: Utare CI — Lint, Typecheck, Test & Build

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master

jobs:
  quality-and-tests:
    name: Quality Checks (Lint, Typecheck, Tests & Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Compiler Check
        run: npm run typecheck

      - name: Run Automated Unit & Integration Tests (Vitest)
        run: npm run test:ci

      - name: Verify Next.js Production Build
        run: npm run build
