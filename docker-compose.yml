# =============================================================================
# UTARE ZISEDU AI — Docker Compose Configuration
# =============================================================================
# Usage:
#   docker compose up --build        # Start in foreground with live logs
#   docker compose up -d --build     # Start in detached background mode
#   docker compose down              # Stop containers
# =============================================================================

services:
  web:
    container_name: utare-zisedu-web
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      # Mount local workspace into container for instant live code reloading
      - .:/app
      # Isolate container node_modules & .next build cache in named volumes
      # so host OS binaries (Mac/Windows/Linux) never conflict
      - utare_node_modules:/app/node_modules
      - utare_next_cache:/app/.next
    env_file:
      - path: .env.local
        required: false
      - path: .env
        required: false
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - NEXT_TELEMETRY_DISABLED=1
      - DATABASE_URL=postgresql://utare_user:utare_password@db:5432/utare_db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    container_name: utare-zisedu-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: utare_user
      POSTGRES_PASSWORD: utare_password
      POSTGRES_DB: utare_db
    ports:
      - "5432:5432"
    volumes:
      - utare_pgdata:/var/lib/postgresql/data
      - ./supabase/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U utare_user -d utare_db"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  utare_node_modules:
  utare_next_cache:
  utare_pgdata:
